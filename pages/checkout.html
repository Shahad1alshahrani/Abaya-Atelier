<section class="checkout-page-section">

        <div class="checkout-box">

            <h1 class="checkout-title">Checkout</h1>

            <!-- SHIPPING ADDRESS -->
            <h2>Shipping Address</h2>
            <form>
                <label>Full Name:</label>
                <input type="text" required placeholder="Enter your full name">

                <label>Phone Number:</label>
                <input type="tel" required placeholder="05xxxxxxxx">

                <label>City:</label>
                <select required>
                    <option value="">Select City</option>
                    <option value="riyadh">Riyadh</option>
                    <option value="jeddah">Jeddah</option>
                    <option value="dammam">Dammam</option>
                    <option value="mecca">Mecca</option>
                    <option value="medina">Medina</option>
                    <option value="khobar">Al Khobar</option>
                    <option value="tabuk">Tabuk</option>
                    <option value="taif">Taif</option>
                    <option value="abha">Abha</option>
                    <option value="buraydah">Buraydah</option>
                    <option value="alhassa">Al Hasa</option>
                </select>

                <label>Full Address:</label>
                <input type="text" required placeholder="Street">
                <input type="text" required placeholder="Building number">
                <input type="text" placeholder="Apartment number">
    
                <!-- PAYMENT METHOD -->
                <h2>Payment Method</h2>
<div class="payment-options">
    <label class="payment-option">
        <input type="radio" name="payment" value="applepay" required>
        <img src="https://download.logo.wine/logo/Apple_Pay/Apple_Pay-Logo.wine.png" alt="Apple Pay">
    </label>

    <label class="payment-option">
        <input type="radio" name="payment" value="tabby">

    </label>

    <label class="payment-option">
        <input type="radio" name="payment" value="tamara">

    </label>

    <label class="payment-option">
        <input type="radio" name="payment" value="cash">
        <img src="https://cdn-icons-png.flaticon.com/512/4470/4470504.png" alt="Cash">
    </label>

    <label class="payment-option">
        <input type="radio" name="payment" value="other">
        <img src="https://i.fbcd.co/products/resized/resized-750-500/one007e-16-e03-mainpreview-6b6524e4151ae44beedb41f9e2c40cbf720038c4052e525ac6e3017b8de7a482.jpg" alt="Other">

    <label class="payment-option">

    </label>
</div>

                <input type="text" placeholder="XXX">

                <button type="submit" class="btn">Place Order</button>
